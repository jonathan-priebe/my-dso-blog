<svg width="320" height="216" viewBox="0 0 320 216" xmlns="http://www.w3.org/2000/svg">

  <!-- Abgerundeter Rahmen / Kanten wie in deinen Vorlagen -->
  <defs>
    <clipPath id="rounded">
      <rect width="320" height="216" rx="30"/>
    </clipPath>
  </defs>

  <!-- Inhalt wird in die abgerundeten Kanten geclippt -->
  <g clip-path="url(#rounded)">

    <!-- Hintergrund -->
    <rect width="320" height="216" fill="#F4F9FF"/>

    <!-- Hellblauer Kreis hinter dem Baby -->
    <circle cx="160" cy="85" r="60" fill="#CFE8FF"/>

    <!-- Baby-Kopf -->
    <g transform="translate(160,90)">
      <!-- Kopf -->
      <circle cx="0" cy="0" r="40" fill="#FFE0C2"/>

      <!-- Haarlocke -->
      <path d="M-4 -22
               C-2 -30 6 -30 8 -24
               C9 -20 5 -18 3 -20"
            fill="none"
            stroke="#D49A6A"
            stroke-width="3"
            stroke-linecap="round"/>

      <!-- Augen -->
      <circle cx="-14" cy="-4" r="4.5" fill="#333333"/>
      <circle cx="14"  cy="-4" r="4.5" fill="#333333"/>

      <!-- Wangen -->
      <circle cx="-20" cy="4" r="5" fill="#FFB6B6" opacity="0.7"/>
      <circle cx="20"  cy="4" r="5" fill="#FFB6B6" opacity="0.7"/>

      <!-- Lächeln -->
      <path d="M-12 10
               C-6 18 6 18 12 10"
            fill="none"
            stroke="#D47A5A"
            stroke-width="2.5"
            stroke-linecap="round"/>

      <!-- Hände / Arme aufgestützt -->
      <path d="M-26 18
               C-20 26 -10 30 0 30
               C10 30 20 26 26 18"
            fill="#FFE0C2"/>

      <!-- Körper / Unterseite leicht angedeutet -->
      <path d="M-40 32
               C-20 45 20 45 40 32
               C32 42 -32 42 -40 32Z"
            fill="#FAD7B5"
            opacity="0.6"/>
    </g>

    <!-- Kleine Werkzeug-Elemente (Tool-Shop-Theme) -->
    <!-- Schraubenschlüssel links -->
    <g transform="translate(90,135) rotate(-20)">
      <rect x="-4" y="-20" width="8" height="32" rx="3" fill="#9EB3C8"/>
      <path d="M0 -24
               C6 -24 8 -20 8 -16
               C6 -18 4 -18 0 -18
               C-4 -18 -6 -18 -8 -16
               C-8 -20 -6 -24 0 -24Z"
            fill="#9EB3C8"/>
    </g>

    <!-- Schraubendreher rechts -->
    <g transform="translate(230,135) rotate(15)">
      <rect x="-3" y="-18" width="6" height="26" rx="2" fill="#9EB3C8"/>
      <rect x="-6" y="8" width="12" height="10" rx="3" fill="#FFB74D"/>
    </g>

    <!-- Text: Baby Tool Shop -->
    <g transform="translate(160,172)" text-anchor="middle">
      <text x="0" y="0"
            font-family="Poppins, system-ui, sans-serif"
            font-size="22"
            font-weight="600"
            fill="#4A90E2">
        Baby
        <tspan fill="#FF7043"> Tool</tspan>
        <tspan fill="#4A90E2"> Shop</tspan>
      </text>

      <!-- Untertitel -->
      <text x="0" y="22"
            font-family="Poppins, system-ui, sans-serif"
            font-size="11"
            fill="#9BA9C0">
        Safe tools &amp; playful learning
      </text>
    </g>

  </g>

  <!-- Sichtbarer Rahmen oben drauf (wie bei deinen anderen Logos) -->
  <rect width="320" height="216" rx="30" fill="none" stroke="#00000022" stroke-width="4"/>

</svg>
